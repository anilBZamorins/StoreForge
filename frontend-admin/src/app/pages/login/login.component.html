<div class="page">
  <div class="card">
    <div class="brand">
      <span class="brand-mark">SF</span>
      <div>
        <div class="brand-name">StoreForge</div>
        <div class="brand-sub">Store Admin Dashboard</div>
      </div>
    </div>

    <h1>Welcome back</h1>
    <p class="sub">Log in to manage your store.</p>

    @if (mockMode) {
      <div class="hint">Mock mode — use <b>owner&#64;auraliving.com</b> / <b>password</b></div>
    }

    <form (ngSubmit)="submit()">
      <label>Email
        <input type="email" name="email" autocomplete="email" placeholder="you@business.com"
               [ngModel]="email()" (ngModelChange)="email.set($event)">
      </label>
      <label>Password
        <span class="pw">
          <input [type]="showPassword() ? 'text' : 'password'" name="password" autocomplete="current-password"
                 placeholder="••••••••" [ngModel]="password()" (ngModelChange)="password.set($event)">
          <button type="button" class="eye" (click)="showPassword.set(!showPassword())">
            {{ showPassword() ? 'Hide' : 'Show' }}
          </button>
        </span>
      </label>

      @if (error()) { <p class="error">{{ error() }}</p> }

      <button class="btn btn-flame btn-block btn-lg" type="submit" [disabled]="busy()">
        {{ busy() ? 'Logging in…' : 'Log In' }}
      </button>
    </form>

    <p class="foot">New to StoreForge? Start your free trial on the main website.</p>
  </div>
</div>
