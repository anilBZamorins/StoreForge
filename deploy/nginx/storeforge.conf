# /etc/nginx/sites-available/storeforge.conf
# Three Angular SPAs + one Laravel API on a single droplet, routed by hostname:
#   storeforge.io / www      → frontend-website
#   admin.storeforge.io      → frontend-admin
#   {slug}.storeforge.io     → frontend-storefront (tenant resolved from subdomain)
#   /api on any host         → Laravel API via PHP-FPM

# ---------- Marketing website ----------
server {
    listen 80; listen [::]:80;
    server_name storeforge.io www.storeforge.io;
    root /var/www/storeforge/frontend-website/dist/frontend-website/browser;
    include /etc/nginx/snippets/storeforge-common.conf;
}

# ---------- Store Admin ----------
server {
    listen 80; listen [::]:80;
    server_name admin.storeforge.io;
    root /var/www/storeforge/frontend-admin/dist/frontend-admin/browser;
    include /etc/nginx/snippets/storeforge-common.conf;
}

# ---------- Tenant storefronts (wildcard, keep last) ----------
server {
    listen 80 default_server; listen [::]:80 default_server;
    server_name *.storeforge.io;
    root /var/www/storeforge/frontend-storefront/dist/frontend-storefront/browser;
    include /etc/nginx/snippets/storeforge-common.conf;
}
