# /etc/nginx/sites-available/storeforge.conf
# Serves the marketing site (storeforge.io) AND every tenant storefront
# (*.storeforge.io) from the same Laravel app. Laravel's IdentifyTenant
# middleware resolves the store from the subdomain.

server {
    listen 80;
    listen [::]:80;
    server_name storeforge.io www.storeforge.io *.storeforge.io;

    root /var/www/storeforge/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|svg|css|js|woff2?)$ {
        expires 30d;
        access_log off;
    }

    location ~ /\.(?!well-known).* { deny all; }

    error_log  /var/log/nginx/storeforge-error.log;
    access_log /var/log/nginx/storeforge-access.log;
}
# After SSL (certbot with wildcard DNS challenge), certbot rewrites this
# file to listen 443 ssl and adds the redirect from port 80.
