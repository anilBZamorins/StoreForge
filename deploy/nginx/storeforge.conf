# /etc/nginx/sites-available/storeforge.conf
# Angular SPA + Laravel API on one droplet.
# storeforge.io and *.storeforge.io both serve the SPA; the Angular
# TenantService resolves the store from the subdomain, and /api is
# handled by the Laravel backend via PHP-FPM.

server {
    listen 80;
    listen [::]:80;
    server_name storeforge.io www.storeforge.io *.storeforge.io;

    root /var/www/storeforge/frontend/dist/storeforge-frontend/browser;
    index index.html;

    charset utf-8;
    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Laravel API
    location /api {
        root /var/www/storeforge/backend/public;
        try_files $uri /index.php?$query_string;
    }
    location ~ ^/api/.*\.php$ { deny all; }
    location = /index.php {
        root /var/www/storeforge/backend/public;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Angular SPA — client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|svg|css|js|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    error_log  /var/log/nginx/storeforge-error.log;
    access_log /var/log/nginx/storeforge-access.log;
}
